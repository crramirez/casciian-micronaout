plugins {
    id 'java-library'
}

description = 'Micronaut extension that exposes Casciian admin sessions over SSH and Unix sockets.'

dependencies {
    api "io.github.crramirez:casciian:${casciianVersion}"
    api "io.micronaut:micronaut-context:${micronautVersion}"
    compileOnly "io.micronaut:micronaut-inject-java:${micronautVersion}"
    annotationProcessor "io.micronaut:micronaut-inject-java:${micronautVersion}"

    implementation "org.apache.sshd:sshd-core:${sshdVersion}"

    testImplementation "io.micronaut:micronaut-inject:${micronautVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.4'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}
