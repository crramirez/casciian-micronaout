plugins {
    id 'io.micronaut.library' version "${micronautPluginVersion}"
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'idea'
}

description = 'Micronaut integration that exposes a Casciian TUI over SSH and/or a Unix domain socket.'

group = 'io.github.crramirez'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

idea {
    module {
        downloadSources = true
    }
}

repositories {
    mavenCentral()
}

micronaut {
    version "${micronautVersion}"
    processing {
        incremental true
        annotations 'io.github.crramirez.casciian.micronaut.*'
    }
}

dependencies {
    // Casciian core (consumed from Maven Central so this module can live
    // independently and eventually be extracted to its own repository).
    api "io.github.crramirez:casciian:${casciianVersion}"

    // Micronaut framework: inject + runtime + context for declaring beans
    // and listening to startup/shutdown events. The Micronaut BOM (pulled
    // in transitively by the `io.micronaut.library` plugin) keeps versions
    // aligned.
    implementation 'io.micronaut:micronaut-inject'
    implementation 'io.micronaut:micronaut-context'
    annotationProcessor 'io.micronaut:micronaut-inject-java'

    // Embedded SSH server.
    implementation "org.apache.sshd:sshd-core:${sshdVersion}"

    // Tests run under Micronaut Test so we can spin up an
    // ApplicationContext and validate bean wiring.
    testImplementation 'io.micronaut.test:micronaut-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testAnnotationProcessor 'io.micronaut:micronaut-inject-java'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Xlint:-serial']
}

tasks.jar {
    manifest {
        attributes(
                'Implementation-Title': 'casciian-micronaut',
                'Implementation-Version': project.version
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'casciian-micronaut'
                description = 'Micronaut integration that exposes a Casciian TUI over SSH and/or a Unix domain socket.'
                url = 'https://github.com/crramirez/casciian'

                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'crramirez'
                        name = 'crramirez'
                        url = 'https://github.com/crramirez'
                    }
                }
                scm {
                    url = 'https://github.com/crramirez/casciian'
                    connection = 'scm:git:https://github.com/crramirez/casciian.git'
                    developerConnection = 'scm:git:ssh://git@github.com/crramirez/casciian.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'localStaging'
            url = layout.buildDirectory.dir('staging-repo')
        }
    }
}

def signingKeyId = (findProperty('signingKeyId') ?: System.getenv('SIGNING_KEY_ID'))?.toString()
def signingKeyB64 = (findProperty('signingKeyB64') ?: System.getenv('SIGNING_KEY_B64'))?.toString()
def signingPassword = (findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD'))?.toString()

def signingKey = null
if (signingKeyB64) {
    signingKey = new String(Base64.decoder.decode(signingKeyB64), 'UTF-8')
}

signing {
    if (signingKeyId && signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
        sign publishing.publications
    }
}

tasks.javadoc {
    options.memberLevel = JavadocMemberLevel.PROTECTED
    options.author = true
    options.version = true
    options.links('https://docs.oracle.com/en/java/javase/21/docs/api/')
    options.addStringOption('Xdoclint:none', '-quiet')
}
