plugins {
    id 'application'
    id 'io.micronaut.application' version "${micronautGradlePluginVersion}"
}

description = 'Customer-facing Micronaut demo wired to a Casciian admin session.'

micronaut {
    version micronautVersion
    runtime 'netty'
    testRuntime 'junit5'
    processing {
        incremental true
        annotations 'io.github.crramirez.casciian.demo.shop.*'
    }
}

application {
    mainClass = 'io.github.crramirez.casciian.demo.shop.DemoShopApplication'
}

graalvmNative {
    toolchainDetection = true
    binaries {
        main {
            imageName = 'demo-shop'
            buildArgs.add('--no-fallback')
        }
    }
}

dependencies {
    implementation project(':casciian-micronaut-starter')

    annotationProcessor 'io.micronaut:micronaut-http-validation'
    annotationProcessor 'io.micronaut.validation:micronaut-validation-processor'

    implementation 'io.micronaut:micronaut-http-server-netty'
    implementation 'io.micronaut:micronaut-runtime'
    implementation 'io.micronaut:micronaut-http-client'
    implementation 'io.micronaut:micronaut-jackson-databind'
    implementation 'io.micronaut.views:micronaut-views-thymeleaf'
    implementation 'io.micronaut.validation:micronaut-validation'
    implementation "net.datafaker:datafaker:${datafakerVersion}"

    runtimeOnly 'ch.qos.logback:logback-classic'

    testImplementation 'io.micronaut.test:micronaut-test-junit5'
    testImplementation 'io.micronaut:micronaut-http-client'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}
